name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "8.0.x"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-test:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore HidroSense.sln

      - name: Build
        run: dotnet build HidroSense.sln -c Release --no-restore

      - name: Testes automatizados
        run: >
          dotnet test HidroSense.sln -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --collect "XPlat Code Coverage"
          --results-directory TestResults

      - name: Resumo dos testes
        if: always()
        run: |
          trx=$(find TestResults -name '*.trx' | head -n1)
          [ -n "$trx" ] || exit 0
          counters=$(grep -o '<Counters [^>]*>' "$trx")
          get() { echo "$counters" | sed -n "s/.* $1=\"\([0-9]*\)\".*/\1/p"; }
          {
            echo "### Testes automatizados"
            echo "| Total | Aprovados | Falhas |"
            echo "|---|---|---|"
            echo "| $(get total) | $(get passed) | $(get failed) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/

  bdd-tests:
    name: Testes BDD de API (Cucumber)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Throwaway secrets for this run only: generated, masked in the logs, gone with the runner.
      - name: Gerar .env efêmero
        run: |
          rnd() { openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | head -c 20; }
          db="Db1!$(rnd)"; jwt="$(rnd)$(rnd)"; adm="Adm1!$(rnd)"; op="Op1!$(rnd)"
          for s in "$db" "$jwt" "$adm" "$op"; do echo "::add-mask::$s"; done
          {
            echo "ASPNETCORE_ENVIRONMENT=Development"
            echo "DB_PASSWORD=$db"
            echo "JWT_SECRET_KEY=$jwt"
            echo "SEED_ADMIN_PASSWORD=$adm"
            echo "SEED_OPERATOR_PASSWORD=$op"
          } > .env

      - name: Subir API e SQL Server (docker compose)
        run: docker compose up -d --build --wait api

      - name: Rodar a suíte BDD
        run: docker compose -f docker-compose.yml -f docker-compose.bdd.yml run --rm --build bdd-tests

      - name: Resumo dos testes BDD
        if: always()
        run: |
          xml=bdd-tests/target/cucumber-report/cucumber-junit.xml
          [ -f "$xml" ] || exit 0
          suite=$(grep -o '<testsuite [^>]*>' "$xml" | head -n1)
          get() { echo "$suite" | sed -n "s/.* $1=\"\([0-9]*\)\".*/\1/p"; }
          total=$(get tests); failed=$(( $(get failures) + $(get errors) )); skipped=$(get skipped)
          {
            echo "### Testes BDD de API (Cucumber + RestAssured + JSON Schema)"
            echo "| Cenários | Aprovados | Falhas | Ignorados |"
            echo "|---|---|---|---|"
            echo "| $total | $(( total - failed - skipped )) | $failed | $skipped |"
            echo
            echo "Relatório HTML completo no artefato \`bdd-report\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logs da API
        if: failure()
        run: docker compose logs api --tail 200

      - name: Publicar relatório Cucumber
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bdd-report
          path: bdd-tests/target/cucumber-report/

      - name: Derrubar a stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.bdd.yml down -v

  docker:
    name: Imagem Docker
    needs: [build-test, bdd-tests]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Nome da imagem
        id: ref
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hidrosense-api"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "image=$repo:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ref.outputs.image }}
            ${{ steps.ref.outputs.repo }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: echo "Imagem publicada **${{ steps.ref.outputs.image }}**" >> "$GITHUB_STEP_SUMMARY"

  # Runs only while the AKS target exists (scripts/azure/setup.sh sets AZURE_CLIENT_ID).
  deploy-staging:
    name: Deploy staging
    needs: docker
    if: vars.AZURE_CLIENT_ID != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image: ${{ needs.docker.outputs.image }}
    secrets: inherit

  deploy-production:
    name: Deploy produção
    needs: [docker, deploy-staging]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image: ${{ needs.docker.outputs.image }}
    secrets: inherit
