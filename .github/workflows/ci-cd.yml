name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "8.0.x"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-test:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore HidroSense.sln

      - name: Build
        run: dotnet build HidroSense.sln -c Release --no-restore

      - name: Testes automatizados
        run: >
          dotnet test HidroSense.sln -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --collect "XPlat Code Coverage"
          --results-directory TestResults

      - name: Resumo dos testes
        if: always()
        run: |
          trx=$(find TestResults -name '*.trx' | head -n1)
          [ -n "$trx" ] || exit 0
          counters=$(grep -o '<Counters [^>]*>' "$trx")
          get() { echo "$counters" | sed -n "s/.* $1=\"\([0-9]*\)\".*/\1/p"; }
          {
            echo "### Testes automatizados"
            echo "| Total | Aprovados | Falhas |"
            echo "|---|---|---|"
            echo "| $(get total) | $(get passed) | $(get failed) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/

  docker:
    name: Imagem Docker
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Nome da imagem
        id: ref
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hidrosense-api"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "image=$repo:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ref.outputs.image }}
            ${{ steps.ref.outputs.repo }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: echo "Imagem publicada **${{ steps.ref.outputs.image }}**" >> "$GITHUB_STEP_SUMMARY"

  # Runs only while the AKS target exists (scripts/azure/setup.sh sets AZURE_CLIENT_ID).
  deploy-staging:
    name: Deploy staging
    needs: docker
    if: vars.AZURE_CLIENT_ID != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image: ${{ needs.docker.outputs.image }}
    secrets: inherit

  deploy-production:
    name: Deploy produção
    needs: [docker, deploy-staging]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image: ${{ needs.docker.outputs.image }}
    secrets: inherit
