apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hidrosense-production

resources:
  - ../../base

labels:
  - pairs:
      app.kubernetes.io/environment: production
    includeSelectors: false

configMapGenerator:
  - name: hidrosense-config
    behavior: merge
    literals:
      - ASPNETCORE_ENVIRONMENT=Production
      - Logging__LogLevel__Default=Warning

patches:
  - target:
      kind: Deployment
      name: hidrosense-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          # Low CPU request: both environments share a small 2-node cluster.
          requests: { cpu: 100m, memory: 256Mi }
          limits: { cpu: "1", memory: 512Mi }
  # Public DNS: <label>.<region>.cloudapp.azure.com
  - target:
      kind: Service
      name: hidrosense-api
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          service.beta.kubernetes.io/azure-dns-label-name: hidrosense-athenabriana
