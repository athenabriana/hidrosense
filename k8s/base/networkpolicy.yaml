# Only the API pods may reach SQL Server (same role as the internal "backend" network in Compose).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sqlserver-allow-api-only
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sqlserver
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hidrosense-api
      ports:
        - port: 1433
          protocol: TCP
