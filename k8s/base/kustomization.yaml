# Environment-agnostic stack. Overlays set the namespace, image tag and sizing.
# The Secret "hidrosense-secrets" is created by scripts/k8s-deploy.sh, never committed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: hidrosense
    includeSelectors: false

resources:
  - sqlserver.yaml
  - api.yaml
  - networkpolicy.yaml

configMapGenerator:
  - name: hidrosense-config
    literals:
      - ASPNETCORE_ENVIRONMENT=Production
      - Logging__LogLevel__Default=Information
