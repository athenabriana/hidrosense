# Local stack: API + SQL Server. Values come from .env (copy .env.example).
# Staging and production run on AKS (k8s/).
name: hidrosense

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
      MSSQL_PID: "Developer"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  api:
    image: hidrosense-api:local
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=${DB_NAME:-HidroSense};User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      Jwt__SecretKey: ${JWT_SECRET_KEY:?Defina JWT_SECRET_KEY no .env}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:?Defina SEED_ADMIN_PASSWORD no .env}
      Seed__OperatorPassword: ${SEED_OPERATOR_PASSWORD:?Defina SEED_OPERATOR_PASSWORD no .env}
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  # Persists the database across container restarts and redeploys.
  sqlserver-data:

networks:
  # Database is reachable only from the API.
  backend:
    internal: true
  frontend:
